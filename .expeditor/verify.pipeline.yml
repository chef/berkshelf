---
expeditor:
  defaults:
    buildkite:
      retry:
        automatic:
          limit: 1
      timeout_in_minutes: 30

steps:
# There is no rubydistros image for 3.2, so the minimum-supported-Ruby run uses
# the official image. See berkshelf.gemspec required_ruby_version.
- label: "Integration Debian :ruby: 3.2"
  commands:
    - cd /workdir
    - rm -f .bundle/config
    - apt-get update -y
    - apt-get install -y graphviz libarchive-dev
    - bundle config set --local path 'vendor/bundle'
    - bundle config set --local with 'dep_selector'
    - bundle install --jobs=3 --retry=3
    - bundle exec rake
  expeditor:
    executor:
      docker:
        image: ruby:3.2
        privileged: true

- label: "Integration Ubuntu 24.04 :ruby: 3.4"
  commands:
    - cd /workdir
    - rm -f .bundle/config
    - apt-get update -y
    - apt-get install -y graphviz
    - bundle config set --local path 'vendor/bundle'
    - bundle config set --local with 'dep_selector'
    - bundle install --jobs=3 --retry=3
    - bundle exec rake
  expeditor:
    executor:
      docker:
        image: rubydistros/ubuntu-24.04:3.4
        privileged: true

- label: "Integration Debian :ruby: 4.0"
  commands:
    - cd /workdir
    - rm -f .bundle/config
    - apt-get update -y
    - apt-get install -y graphviz libarchive-dev
    - bundle config set --local path 'vendor/bundle'
    - bundle config set --local with 'dep_selector'
    - bundle install --jobs=3 --retry=3
    - bundle exec rake
  expeditor:
    executor:
      docker:
        image: ruby:4.0
        privileged: true
