# testing
name: CI Matrix Testing

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron:  '21 3 * * *'

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}-latest
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu, macos]
        ruby: [3.1, 3.4]
        include:
          - os: ubuntu
            ruby: 3.1
            container: rubydistros/ubuntu-22.04:3.1
          - os: ubuntu
            ruby: 3.4
            container: rubydistros/ubuntu-24.04:3.4
    container: ${{ matrix.container || '' }}
    steps:
    - uses: actions/checkout@v2
    # Install system dependencies for Ubuntu containers
    - name: Install system dependencies (Ubuntu container)
      if: ${{ matrix.os == 'ubuntu' }}
      run: |
        apt-get update
        apt-get install -y graphviz libarchive-dev autoconf automake
    # Install system dependencies for macOS
    - name: Install system dependencies (macOS)
      if: ${{ matrix.os == 'macos' }}
      run: brew install graphviz libarchive
    # Use ruby/setup-ruby for macOS only (non-container runs)
    - uses: ruby/setup-ruby@v1
      if: ${{ matrix.os == 'macos' }}
      with:
        bundler-cache: true
        ruby-version: ${{ matrix.ruby }}
    # For container runs (Ubuntu), use bundle install directly (like Buildkite)
    - name: Bundle install (container)
      if: ${{ matrix.os == 'ubuntu' }}
      run: |
        rm -f .bundle/config
        rm -rf vendor/bundle
        bundle config set --local path 'vendor/bundle'
        bundle install --jobs=3 --retry=3
    - run: bundle exec rake spec
      if: always()
    - run: bundle exec rake features
      if: always()
    - run: bundle exec rake style
      if: always()
