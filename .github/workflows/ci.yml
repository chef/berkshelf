# testing
name: CI Matrix Testing

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron:  '21 3 * * *'

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}-latest
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu, macos]
        ruby: [3.1, 3.4]
        include:
          - os: ubuntu
            ruby: 3.1
            container: rubydistros/ubuntu-22.04:3.1
          - os: ubuntu
            ruby: 3.4
            container: rubydistros/ubuntu-24.04:3.4
    container: ${{ matrix.container || '' }}
    steps:
    - uses: actions/checkout@v2
    - name: Install system dependencies
      run: |
         if [ "$RUNNER_OS" == "Linux" ]; then
           # For container runs, no sudo needed
           # autoconf/automake provide config.guess/config.sub needed by dep-selector-libgecode
           apt-get update && apt-get install -y graphviz libarchive-dev autoconf automake
         elif [ "$RUNNER_OS" == "Windows" ]; then
           choco install graphviz
         elif [ "$RUNNER_OS" == "macOS" ]; then
           brew install graphviz libarchive
         else
           echo "$RUNNER_OS not supported"
           exit 1
         fi
      shell: bash
    # Use ruby/setup-ruby for macOS only (non-container runs)
    - uses: ruby/setup-ruby@v1
      if: ${{ matrix.os == 'macos' }}
      with:
        bundler-cache: true
        ruby-version: ${{ matrix.ruby }}
    # For container runs (Ubuntu), use bundle install directly (like Buildkite)
    - name: Bundle install (container)
      if: ${{ matrix.os == 'ubuntu' }}
      run: |
        rm -f .bundle/config
        bundle config set --local path 'vendor/bundle'
        bundle install --jobs=3 --retry=3
    - run: bundle exec rake spec
      if: always()
    - run: bundle exec rake features
      if: always()
    - run: bundle exec rake style
      if: always()
